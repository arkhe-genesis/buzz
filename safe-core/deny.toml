# Política cargo-deny calibrada para ARKHE

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "warn"
notice = "warn"
ignore = [
    # Ignorar vulnerabilidades específicas se justificado (ex: "RUSTSEC-2023-0001")
]

[licenses]
unlicensed = "deny"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "CC0-1.0",
    "Zlib",
    "Unlicense",
    "0BSD",
]
deny = [
    "AGPL-3.0",
]
warn = [
    "GPL-3.0",
    "GPL-2.0",
    "LGPL-3.0",
]
exceptions = [
    # Exceções específicas para crates com licenças ambíguas
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
deny = [
    { name = "openssl" },
    { name = "failure" },
    { name = "rustc-serialize" },
]
skip = [
]
skip-tree = [
]

[sources]
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
