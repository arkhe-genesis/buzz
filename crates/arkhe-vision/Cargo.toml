[package]
name = "arkhe-vision"
version = "0.1.0"
edition = "2021"

[dependencies]
# Core
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.5"
bytes = "1.5"

# Image processing
image = "0.24"

# ONNX Runtime (YOLO26)
ort = { version = "2.0.0-rc.9", features = ["ndarray"] }
ndarray = "0.17"

# PyTorch (SAM 3.1) - requires libtorch
tch = { version = "0.14", features = ["download-libtorch"] }  # or use system libtorch

# gRPC (WormGraph)
tonic = "0.11"
prost = "0.12"

# Observability
tracing = "0.1"
tracing-subscriber = "0.3"
prometheus = { version = "0.13", features = ["process"] }

# Async runtime
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"

# Utilities
futures = "0.3"
rand = "0.8"

[build-dependencies]
