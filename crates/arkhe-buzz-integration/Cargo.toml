[package]
name = "arkhe-buzz-integration"
version = "0.1.0"
edition = "2021"

[dependencies]
nalgebra = "0.33"
nostr-sdk = "0.38"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
blake3 = "1.5"
bincode = "1.3"
tokio = { version = "1", features = ["full"] }
thiserror = "1.0"
futures = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
